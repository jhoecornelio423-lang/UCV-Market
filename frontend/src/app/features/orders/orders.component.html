<ion-header class="orders-header ion-no-border">
  <ion-toolbar class="header-toolbar">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/seller" text="" class="back-btn"></ion-back-button>
    </ion-buttons>
    <ion-title>Pedidos</ion-title>
  </ion-toolbar>

  <!-- Figma Tabs para Vendedor -->
  <div class="orders-tabs-figma" *ngIf="activeTab === 'ventas'">
    <button class="tab-item" [class.active]="orderFilter === 'new'" (click)="selectOrderFilter('new')">
      Nuevos
      <span class="dot-badge" *ngIf="newOrdersCount > 0">{{ newOrdersCount }}</span>
    </button>
    <button class="tab-item" [class.active]="orderFilter === 'active'" (click)="selectOrderFilter('active')">
      Activos
    </button>
    <button class="tab-item" [class.active]="orderFilter === 'ready'" (click)="selectOrderFilter('ready')">
      Listos
    </button>
  </div>
</ion-header>

<ion-content [fullscreen]="true" class="orders-content">
  <ion-refresher slot="fixed" (ionRefresh)="refreshOrders($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div class="orders-shell">

    <!-- Empty State -->
    <div *ngIf="!loading && visibleOrders.length === 0" class="empty-state">
      <ion-icon name="bag-handle-outline"></ion-icon>
      <p>No hay pedidos en esta sección</p>
    </div>

    <!-- Orders List -->
    <div class="orders-list-figma" *ngIf="!loading">

      <article *ngFor="let order of visibleOrders" class="order-card-figma">
        <div class="card-body">
          <div class="card-left">
            <p class="order-id">#{{ order.id.substring(0, 3) }} · {{ getOrderDateLabel(order.created_at) }}</p>
            <h4 class="product-title">
              <span *ngFor="let item of order.order_items; let last = last">
                {{ item.product?.name }} x{{ item.quantity }}{{ !last ? ', ' : '' }}
              </span>
            </h4>
            <p class="customer-name">de {{ order.buyer?.full_name }}</p>
          </div>
          <div class="card-right">
            <p class="price">S/ {{ order.total_price.toFixed(2) }}</p>
            <span class="status-label" *ngIf="orderFilter !== 'new'" [class]="order.status">
              {{ getStatusLabel(order.status) }}
            </span>
          </div>
        </div>

        <!-- Acciones Figma: NUEVOS (Pendiente) -->
        <div class="card-actions-figma" *ngIf="order.status === 'pending'">
          <button class="btn-accept" (click)="changeStatus(order, getNextStatus(order.status))">
            <ion-icon [name]="getNextActionIcon(order.status)"></ion-icon>
            {{ getNextActionLabel(order.status) }}
          </button>
          <button class="btn-reject" (click)="changeStatus(order, 'cancelled')">
            <ion-icon name="close"></ion-icon>
            Rechazar
          </button>
        </div>

        <!-- Acciones Figma: ACTIVOS (Aceptado/Preparando) -->
        <div class="card-actions-figma" *ngIf="['accepted', 'preparing'].includes(order.status)">
          <button class="btn-ready" (click)="changeStatus(order, getNextStatus(order.status))">
            {{ getNextActionLabel(order.status) }}
            <ion-icon [name]="getNextActionIcon(order.status)"></ion-icon>
          </button>
        </div>

        <!-- Acciones Figma: LISTOS (Listo para entregar) -->
        <div class="card-actions-figma" *ngIf="order.status === 'ready'">
          <button class="btn-ready" (click)="changeStatus(order, getNextStatus(order.status))">
            {{ getNextActionLabel(order.status) }}
            <ion-icon [name]="getNextActionIcon(order.status)"></ion-icon>
          </button>
        </div>
      </article>

    </div>
  </div>
</ion-content>

<ion-footer class="seller-footer ion-no-border ion-hide-lg-up">
  <nav class="bottom-navigation-figma">
    <button type="button" class="nav-item-figma" (click)="goToSellerDashboard()">
      <ion-icon name="stats-chart-outline"></ion-icon>
      <span>Dashboard</span>
    </button>
    <button type="button" class="nav-item-figma active">
      <ion-icon name="bag-handle"></ion-icon>
      <span>Pedidos</span>
    </button>
    <button type="button" class="nav-item-figma">
      <ion-icon name="pricetag-outline"></ion-icon>
      <span>Productos</span>
    </button>
    <button type="button" class="nav-item-figma">
      <ion-icon name="trending-up-outline"></ion-icon>
      <span>Ventas</span>
    </button>
    <button type="button" class="nav-item-figma">
      <ion-icon name="business-outline"></ion-icon>
      <span>Negocio</span>
    </button>
  </nav>
</ion-footer>
