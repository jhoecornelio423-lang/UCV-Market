<div class="notif-wrap" [class.open-up]="direction === 'up'">
  <button type="button" class="notif-btn" (click)="toggle()" aria-label="Abrir notificaciones" [attr.aria-expanded]="showDropdown" title="Notificaciones">
    <ion-icon name="notifications-outline" aria-hidden="true"></ion-icon>
    <span class="badge" *ngIf="(unreadCount$ | async)! > 0">{{ unreadCount$ | async }}</span>
  </button>

  <div class="notif-backdrop" *ngIf="showDropdown" (click)="showDropdown = false"></div>

  <div class="notif-dropdown" *ngIf="showDropdown">
    <div class="dropdown-header">
      <h4>Notificaciones</h4>
      <div class="dropdown-actions">
        <button type="button" class="mark-read-btn" *ngIf="(unreadCount$ | async)! > 0" (click)="markAllRead()">Marcar leídas</button>
      </div>
    </div>
    <div class="notif-list" *ngIf="(notifications$ | async)?.length; else emptyNotifs">
      <button type="button" class="notif-item" *ngFor="let notif of (notifications$ | async)" [class.unread]="notif.unread" (click)="onNotificationClick(notif)">
        <span class="notif-icon" [style.color]="notif.iconColor" [style.background]="notif.iconBg">
          <ion-icon [name]="notif.icon"></ion-icon>
        </span>
        <span class="notif-content">
          <strong>{{ notif.title }}</strong>
          <span class="notif-body">{{ notif.body }}</span>
          <span class="time">{{ notif.time }}</span>
        </span>
      </button>
    </div>
    <ng-template #emptyNotifs>
      <div class="empty-notifs">
        <p>No tienes notificaciones</p>
      </div>
    </ng-template>
  </div>
</div>
