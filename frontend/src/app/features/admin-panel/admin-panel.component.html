<div class="admin-layout">
  
  <!-- Sidebar (Desktop) -->
  <aside class="admin-sidebar ion-hide-md-down">
    <div class="sidebar-header">
      <div class="logo-circle">
        <ion-icon name="bag-handle"></ion-icon>
      </div>
      <div class="logo-text">
        <h2>UCV Market</h2>
        <span>ADMIN PANEL</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/admin/dashboard" routerLinkActive="active" class="nav-item">
        <ion-icon name="grid"></ion-icon>
        <span>Dashboard</span>
      </a>
      <a routerLink="/admin/sellers" routerLinkActive="active" class="nav-item">
        <ion-icon name="storefront-outline"></ion-icon>
        <span>Vendedores</span>
        <span class="badge" *ngIf="pendingApplicationsCount > 0">{{ pendingApplicationsCount }}</span>
      </a>
      <a routerLink="/admin/products" routerLinkActive="active" class="nav-item">
        <ion-icon name="cube-outline"></ion-icon>
        <span>Productos</span>
      </a>
      <a routerLink="/admin/categories" routerLinkActive="active" class="nav-item">
        <ion-icon name="pricetag-outline"></ion-icon>
        <span>Categorías</span>
      </a>
      <a routerLink="/admin/support" routerLinkActive="active" class="nav-item">
        <ion-icon name="chatbubble-outline"></ion-icon>
        <span>Soporte</span>
        <span class="badge" *ngIf="openTicketsCount > 0">{{ openTicketsCount }}</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="user-profile">
        <div class="avatar">{{ initials }}</div>
        <div class="user-info">
          <h4>{{ userProfile?.full_name || 'Admin' }}</h4>
          <span>Super Admin</span>
        </div>
        <ion-icon name="log-out-outline" class="bell-icon" style="cursor: pointer; color: #EF4444;" (click)="signOut()" title="Cerrar sesión"></ion-icon>
      </div>
    </div>
  </aside>

  <!-- Main Content Area -->
  <main class="admin-main-content">
    <ion-router-outlet></ion-router-outlet>
  </main>

  <!-- Bottom Navigation (Mobile) -->
  <nav class="admin-bottom-nav ion-hide-md-up">
    <a routerLink="/admin/dashboard" routerLinkActive="active" class="bottom-nav-item">
      <ion-icon name="grid"></ion-icon>
      <span>Dashboard</span>
    </a>
    <a routerLink="/admin/sellers" routerLinkActive="active" class="bottom-nav-item">
      <div class="icon-wrapper">
        <ion-icon name="storefront-outline"></ion-icon>
      </div>
      <span>Vendedores</span>
    </a>
    <a routerLink="/admin/products" routerLinkActive="active" class="bottom-nav-item">
      <ion-icon name="cube-outline"></ion-icon>
      <span>Productos</span>
    </a>
    <a routerLink="/admin/categories" routerLinkActive="active" class="bottom-nav-item">
      <ion-icon name="pricetag-outline"></ion-icon>
      <span>Categorías</span>
    </a>
    <a routerLink="/admin/support" routerLinkActive="active" class="bottom-nav-item">
      <div class="icon-wrapper">
        <ion-icon name="chatbubble-outline"></ion-icon>
      </div>
      <span>Soporte</span>
    </a>
  </nav>

</div>
