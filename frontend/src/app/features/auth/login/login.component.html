<ion-content [fullscreen]="true" class="login-content">
  <main class="login-shell">
    <section class="login-panel">
      <!-- Top Shape -->
      <div class="top-shape"></div>

      <!-- Header -->
      <div class="topbar">
        <a class="back-button" routerLink="/login" aria-label="Volver">
          <ion-icon name="arrow-back-outline"></ion-icon>
        </a>
      </div>

      <header class="brand-header" aria-label="VALLE-GO">
        <div class="brand-logo-text">
          <div class="brand-mark-vallego">
            <img src="assets/valle-go-assets/logo_vallego.png" alt="Logo de VALLE-GO" />
          </div>
        </div>
      </header>

      <div class="welcome-copy">
        <h1>Inicia sesión</h1>
        <p>Accede a tu comunidad universitaria</p>
      </div>

      <form class="login-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="input-group" [class.has-error]="loginForm.get('email')?.touched && loginForm.get('email')?.invalid">
          <!-- <label for="email">Correo universitario</label> Removed for mobile mockup -->
          <div class="input-wrapper">
            <ion-icon name="mail-outline" class="input-icon"></ion-icon>
            <input
              id="email"
              type="email"
              placeholder="Correo universitario"
              formControlName="email"
              autocomplete="username"
            />
          </div>
          <span class="error-msg" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.hasError('required')">El correo es requerido.</span>
          <span class="error-msg" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.hasError('email')">Ingresa un correo electrónico válido.</span>
        </div>

        <div class="input-group password-group" [class.has-error]="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
          <!-- <label for="password">Contraseña</label> Removed for mobile mockup -->
          <div class="input-wrapper">
            <ion-icon name="lock-closed-outline" class="input-icon"></ion-icon>
            <input
              id="password"
              [type]="showPassword ? 'text' : 'password'"
              placeholder="Contraseña"
              formControlName="password"
              autocomplete="current-password"
            />
            <button type="button" class="password-toggle" (click)="togglePasswordVisibility()" [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
              <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
            </button>
          </div>
          <span class="error-msg" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.hasError('required')">La contraseña es requerida.</span>
          <span class="error-msg" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.hasError('minlength')">Debe tener al menos 6 caracteres.</span>
        </div>

        <div class="forgot-row">
          <a class="forgot-pass-link" (click)="onForgotPassword()">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" class="submit-btn">Iniciar sesión</button>
      </form>

      <div class="divider"><span>o continúa con</span></div>

      <button type="button" class="google-btn">
        <ion-icon name="logo-google"></ion-icon>
        Continuar con Google
      </button>

      <footer class="footer-links">
        <p>¿No tienes cuenta? <a routerLink="/login/register">Regístrate</a></p>
      </footer>

      <!-- Bottom Shapes -->
      <div class="bottom-left-shape"></div>
      <div class="bottom-right-shape"></div>
    </section>
  </main>
</ion-content>
