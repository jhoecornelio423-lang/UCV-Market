<ion-content [fullscreen]="true">
  <div class="products-list-view">
    <header class="products-header-figma">
      <h1>Mis productos</h1>
      <button type="button" class="btn-new-product" (click)="openCreateForm()">
        <ion-icon name="add"></ion-icon>
        Nuevo
      </button>
    </header>

    <div class="product-filters">
      <input id="product-search" name="productSearch" type="search" aria-label="Buscar productos"
             placeholder="Buscar por nombre" [(ngModel)]="searchTerm">
      <div class="status-filters" role="group" aria-label="Filtrar productos por estado">
        <button type="button" [attr.aria-pressed]="statusFilter === 'all'" (click)="statusFilter = 'all'">Todos</button>
        <button type="button" [attr.aria-pressed]="statusFilter === 'active'" (click)="statusFilter = 'active'">Activos</button>
        <button type="button" [attr.aria-pressed]="statusFilter === 'inactive'" (click)="statusFilter = 'inactive'">Inactivos</button>
      </div>
    </div>

    <div class="products-grid-figma">

      <!-- SKELETON LOADER -->
      <ng-container *ngIf="loading$ | async">
        <div *ngFor="let i of [1,2,3]" class="product-item-card skeleton">
            <div class="card-main-content">
                <div class="product-img skeleton-box"></div>
                <div class="product-details">
                    <div class="skeleton-line w-60"></div>
                    <div class="skeleton-line w-40 mt-10"></div>
                </div>
            </div>
        </div>
      </ng-container>

      <article *ngFor="let product of filterProducts((products$ | async) || [])" class="product-item-card" [hidden]="loading$ | async">
        <div class="card-main-content">
          <div class="product-img">
            <img [src]="product.product_images?.[0]?.image_url || 'assets/images/login-food-banner.jpg'" [alt]="product.name">
          </div>
          <div class="product-details">
            <div class="title-status">
              <h3>{{ product.name }}</h3>
              <button type="button" class="status-indicator"
                   [class.active]="product.is_active && product.stock > 0"
                   [class.out-of-stock]="product.stock <= 0"
                   [disabled]="product.stock <= 0"
                   [attr.aria-pressed]="product.is_active && product.stock > 0"
                   [attr.aria-label]="'Cambiar estado de ' + product.name"
                   (click)="product.stock > 0 ? toggleStatus(product) : null">
                <span class="dot"></span>
                {{ product.stock <= 0 ? 'Agotado' : (product.is_active ? 'Activo' : 'Pausado') }}
              </button>
            </div>
            <p class="category-text">{{ getCategoryName(product.category_id) }}</p>
            <div class="price-rating">
              <span class="price">S/ {{ product.price.toFixed(2) }}</span>
              <div class="rating" *ngIf="product.rating_average">
                <ion-icon name="star" class="star-gold-mini"></ion-icon>
                <span>{{ product.rating_average }}</span>
              </div>
            </div>
          </div>
        </div>
        <div class="card-actions-row">
          <button type="button" class="btn-edit" (click)="openEditForm(product)">
            <ion-icon name="create-outline"></ion-icon>
            Editar
          </button>
          <div class="v-divider"></div>
          <button type="button" class="btn-delete" (click)="deleteProduct(product)">
            <ion-icon name="trash-outline"></ion-icon>
            Eliminar
          </button>
        </div>
      </article>

      <div *ngIf="(loading$ | async) === false && (products$ | async)?.length === 0" class="empty-state-products">
        <ion-icon name="pricetag-outline"></ion-icon>
        <p>Aún no tienes productos publicados.</p>
        <button (click)="openCreateForm()">Publicar mi primer producto</button>
      </div>
      <div *ngIf="(loading$ | async) === false && ((products$ | async)?.length || 0) > 0 && filterProducts((products$ | async) || []).length === 0" class="empty-state-products">
        <ion-icon name="search-outline"></ion-icon>
        <p>No hay productos que coincidan con estos filtros.</p>
        <button type="button" (click)="clearFilters()">Limpiar filtros</button>
      </div>
    </div>
  </div>
</ion-content>
