<ion-content [fullscreen]="true" class="business-view-figma">
  <header class="business-header-simple">
    <h1>Mi negocio</h1>
  </header>

  <div class="business-scroll-area">
    <div class="business-visuals">
      <div class="banner-wrapper">
        <img [src]="businessBannerUrl" [alt]="'Banner de ' + (bName || 'mi negocio')" (error)="onBannerError()">
        <button class="edit-banner-btn" type="button" aria-label="Cambiar banner del negocio" (click)="bannerInput.click()">
          <ion-icon name="camera-outline"></ion-icon>
        </button>
        <input id="business-banner" name="businessBanner" type="file" #bannerInput style="display: none;" (change)="onBannerSelected($event)" accept="image/*">
      </div>
      <label class="profile-pic-wrapper" for="business-avatar" aria-label="Cambiar foto del negocio">
        <img [src]="businessAvatarUrl" [alt]="'Foto de ' + (bName || 'mi negocio')" (error)="onAvatarError()">
        <div class="avatar-edit-overlay">
          <ion-icon name="camera-outline"></ion-icon>
        </div>
        <input id="business-avatar" name="businessAvatar" type="file" #avatarInput style="display: none;" (change)="onAvatarSelected($event)" accept="image/*">
      </label>
    </div>

    <div class="business-card-figma">
      <div class="input-group-figma">
        <label for="business-name">Nombre del negocio</label>
        <input id="business-name" name="businessName" type="text" [(ngModel)]="bName">
      </div>
      <div class="divider-line"></div>
      <div class="input-group-figma">
        <label for="business-category">Categoría</label>
        <input id="business-category" name="businessCategory" type="text" [(ngModel)]="bCategory">
      </div>
      <div class="divider-line"></div>
      <div class="input-group-figma">
        <label for="business-description">Descripción</label>
        <textarea id="business-description" name="businessDescription" [(ngModel)]="bDescription" rows="3"></textarea>
      </div>
    </div>

    <div class="business-card-figma">
      <div class="input-group-figma location-group">
        <label for="business-location">UBICACIÓN EN EL CAMPUS</label>
        <div class="location-input-wrapper">
          <input id="business-location" name="businessLocation" type="text" [(ngModel)]="bLocation">
          <div class="red-dot"></div>
        </div>
      </div>
      <div class="divider-line"></div>
      <div class="horario-group">
        <label class="section-label">HORARIO DE ATENCIÓN</label>
        <div class="time-inputs-row">
          <div class="time-field">
            <label for="business-open-time">Apertura</label>
            <input id="business-open-time" name="businessOpenTime" type="time" [(ngModel)]="bOpenTime">
          </div>
          <div class="time-field">
            <label for="business-close-time">Cierre</label>
            <input id="business-close-time" name="businessCloseTime" type="time" [(ngModel)]="bCloseTime">
          </div>
        </div>
      </div>
    </div>

    <div class="business-card-figma toggles-card">
      <div class="toggle-row">
        <div class="toggle-info">
          <h3>Aceptando pedidos</h3>
          <p>Los estudiantes pueden hacer pedidos</p>
        </div>
        <ion-toggle id="accepting-orders" name="acceptingOrders" aria-label="Aceptar pedidos" color="danger" [(ngModel)]="bAcceptingOrders"></ion-toggle>
      </div>

      <div class="toggle-row">
        <div class="toggle-info">
          <h3>Notificaciones push</h3>
          <p>Recibe alertas de nuevos pedidos</p>
        </div>
        <ion-toggle id="push-notifications" name="pushNotifications" aria-label="Notificaciones push" color="danger" [(ngModel)]="bPushEnabled"></ion-toggle>
      </div>

      <button type="button" class="toggle-row support-row" (click)="contactSupport()">
        <div class="toggle-info">
          <h3>Contactar con Soporte</h3>
          <p>¿Problemas o sugerencias? Escríbenos</p>
        </div>
        <ion-icon name="chevron-forward-outline" color="medium" style="font-size: 20px;"></ion-icon>
      </button>
    </div>

    <div class="footer-actions-business">
      <button type="button" class="btn-save-business" (click)="saveBusinessInfo()">
        Guardar cambios
      </button>
    </div>
  </div>
</ion-content>
