<ion-content [fullscreen]="true" class="profile-content">
  <div class="profile-main-shell">

    <div class="main-content-wrapper">
      <header class="profile-header ion-no-border">
        <ion-toolbar class="header-toolbar">
          <ion-buttons slot="start">
            <ion-back-button defaultHref="/catalog" text="" class="back-btn"></ion-back-button>
          </ion-buttons>
          <ion-title>Mi Perfil</ion-title>
        </ion-toolbar>
      </header>

      <div class="profile-shell">
        <!-- User Info Figma Style -->
        <div class="user-card-figma">
          <div class="avatar-circle">
            {{ initials }}
          </div>
          <div class="user-data">
            <h2>{{ profile?.full_name }}</h2>
            <p>{{ email }}</p>
            <span class="role-badge">{{ roleLabel }}</span>
          </div>
        </div>

        <!-- Quick Stats -->
        <div class="profile-stats-grid">
          <div class="stat-item">
            <span class="val">{{ ordersCount }}</span>
            <span class="lbl">Pedidos</span>
          </div>
          <div class="stat-item">
            <span class="val">{{ favoritesCount }}</span>
            <span class="lbl">Favoritos</span>
          </div>
          <div class="stat-item">
            <span class="val">{{ reviewsCount }}</span>
            <span class="lbl">Reseñas</span>
          </div>
        </div>

        <!-- Menu Options -->
        <div class="profile-menu">
          <button class="menu-item" (click)="showPendingSection('Mis datos')">
            <ion-icon name="person-circle-outline"></ion-icon>
            <span>Mis datos personales</span>
            <ion-icon name="chevron-forward-outline" class="chevron"></ion-icon>
          </button>

          <button class="menu-item" (click)="openSellerSection()">
            <ion-icon [name]="profile?.role === 'emprendedor' ? 'storefront-outline' : 'rocket-outline'"></ion-icon>
            <span>{{ profile?.role === 'emprendedor' ? 'Panel de Emprendedor' : 'Activar modo Emprendedor' }}</span>
            <ion-icon name="chevron-forward-outline" class="chevron"></ion-icon>
          </button>

          <button class="menu-item" (click)="showPendingSection('Configuración')">
            <ion-icon name="settings-outline"></ion-icon>
            <span>Configuración</span>
            <ion-icon name="chevron-forward-outline" class="chevron"></ion-icon>
          </button>

          <button class="menu-item logout" (click)="confirmSignOut()">
            <ion-icon name="log-out-outline"></ion-icon>
            <span>Cerrar sesión</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</ion-content>

<ion-footer class="seller-footer ion-no-border ion-hide-lg-up">
  <nav class="bottom-navigation-figma">
    <button type="button" class="nav-item-figma" (click)="goToCatalog()">
      <ion-icon name="home-outline"></ion-icon>
      <span>Inicio</span>
    </button>
    <button type="button" class="nav-item-figma" (click)="goToCatalog()">
      <ion-icon name="compass-outline"></ion-icon>
      <span>Explorar</span>
    </button>
    <button type="button" class="nav-item-figma" (click)="goToOrders()">
      <ion-icon name="receipt-outline"></ion-icon>
      <span>Pedidos</span>
    </button>
    <button type="button" class="nav-item-figma">
      <ion-icon name="heart-outline"></ion-icon>
      <span>Favoritos</span>
    </button>
    <button type="button" class="nav-item-figma active">
      <ion-icon name="person"></ion-icon>
      <span>Perfil</span>
    </button>
  </nav>
</ion-footer>
